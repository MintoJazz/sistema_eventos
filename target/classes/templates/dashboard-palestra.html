<!DOCTYPE html>
<html lang="pt-br" class="dark">
<head>
    <meta charset="UTF-8">
    <title>Palestras | Sistema de Eventos</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap'); body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-zinc-950 text-zinc-300 antialiased min-h-screen flex" data-entidade="palestra">
    
    <app-sidebar role="{{role}}"></app-sidebar>

    <main class="flex-1 ml-64 p-8">
        <div class="flex items-center justify-between mb-8">
            <div>
                <h1 class="text-2xl font-semibold text-white">Todas as Palestras</h1>
                <p class="text-sm text-zinc-500 mt-1">Visão geral de conteúdo do sistema.</p>
            </div>
        </div>
        <div class="w-full bg-zinc-900/50 border border-zinc-800 rounded-xl overflow-hidden shadow-2xl">
            <div class="flex items-center px-6 py-3 border-b border-zinc-800 bg-zinc-900 text-xs font-semibold text-zinc-500 uppercase tracking-wider">
                <div class="flex-1">Tema</div>
                <div class="w-40 text-center">Data/Hora</div>
                <div class="w-24 text-center">Duração</div>
                <div class="w-32 text-right">Ações</div>
            </div>
            <div class="divide-y divide-zinc-800/50">
                {{#lista}}
                <div class="flex items-center px-6 py-4 hover:bg-zinc-800/40 transition-colors">
                    <div class="flex-1 pl-1">
                        <div class="font-medium text-zinc-200">{{nome}}</div>
                    </div>
                    <div class="w-40 text-center text-xs text-zinc-400 font-mono">
                        {{dataHora}}
                    </div>
                    <div class="w-24 text-center text-xs text-zinc-500">
                        {{duracao}} min
                    </div>
                    <div class="w-32 flex justify-end gap-3 items-center">
                        <a href="/read/palestra/id/{{id}}" class="text-zinc-500 hover:text-white transition-colors text-xs font-medium">Ver</a>
                        <button type="button" class="btn-delete text-zinc-500 hover:text-red-500 transition-colors" data-url="/delete/palestra/{{id}}">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                        </button>
                    </div>
                </div>
                {{/lista}}
                {{^lista}}
                <div class="p-8 text-center text-zinc-500 text-sm">Nenhuma palestra encontrada.</div>
                {{/lista}}
            </div>
        </div>
    </main>
    <script type="module" src="/js/delete.js"></script>
    <script type="module" src="/js/aside.js"></script>
</body>
</html>
