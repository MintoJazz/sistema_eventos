<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nova Palestra</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css" />
</head>

<body>
    <main class="container">
        <h1>Nova Palestra</h1>
        <form id="formulario" method="post" action="/palestra">
            <fieldset>
                <article>
                    <header>Informações</header>
                    <label>
                        <label for="palestra-nome">Nome</label>
                        <input id="palestra-nome" name="palestra-nome" placeholder="Nome da Palestra"
                            autocomplete="given-name" />
                    </label>
                    <label>
                        <label for="duracao">Duração (em horas)</label>
                        <input id="duracao" type="number" name="duracao" placeholder="Duração" aria-label="Number">
                    </label>
                    <label>
                        <label for="datetime">Data e hora de início</label>
                        <input id="datetime" type="datetime-local" name="datetime" aria-label="Datetime local">
                    </label>
                    <select id="evento-palestra" name="evento-palestra" aria-label="Select your favorite cuisine..."
                        required>
                        <option selected disabled value="">
                            Essa palestra pertence ao evento...
                        </option>
                        {{#eventos}}
                        <option value="{{id}}"> {{nome}} </option>
                        {{/eventos}}
                    </select>
                </article>
                <article id="palestrantes">
                    <Header>Palestrantes</Header>
                    {{#palestrantes}}
                    <label>
                        <input class="palestrante" type="checkbox" name="palestrantes" value="{{id}}"> {{nome}}
                    </label>
                    {{/palestrantes}}
                </article>
            </fieldset>

            <input type="submit" value="Adicionar Palestra" />
        </form>

        <script type="module" src="/js/requisicoes.js"></script>
    </main>
</body>

</html>
