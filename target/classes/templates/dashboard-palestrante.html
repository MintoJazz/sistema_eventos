<!DOCTYPE html>
<html lang="pt-br" class="dark">
<head>
    <meta charset="UTF-8">
    <title>Palestrantes | Sistema de Eventos</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap'); body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-zinc-950 text-zinc-300 antialiased min-h-screen flex" data-entidade="palestrante">
    
    <app-sidebar role="{{role}}"></app-sidebar>

    <main class="flex-1 ml-64 p-8">
        <div class="flex items-center justify-between mb-8">
            <div>
                <h1 class="text-2xl font-semibold text-white">Elenco de Palestrantes</h1>
                <p class="text-sm text-zinc-500 mt-1">Pessoas que ministram conteúdo no sistema.</p>
            </div>
        </div>
        <div class="w-full bg-zinc-900/50 border border-zinc-800 rounded-xl overflow-hidden shadow-2xl">
            <div class="flex items-center px-6 py-3 border-b border-zinc-800 bg-zinc-900 text-xs font-semibold text-zinc-500 uppercase tracking-wider">
                <div class="flex-1">Nome</div>
                <div class="w-40 text-center">Atuações</div>
                <div class="w-32 text-right">Ações</div>
            </div>
            <div class="divide-y divide-zinc-800/50">
                {{#lista}}
                <div class="flex items-center px-6 py-4 hover:bg-zinc-800/40 transition-colors">
                    <div class="flex-1 flex items-center gap-3 pl-1">
                        <div class="w-8 h-8 rounded-full bg-indigo-500/20 text-indigo-400 flex items-center justify-center text-xs font-bold">P</div>
                        <div class="font-medium text-zinc-200">{{nome}}</div>
                    </div>
                    <div class="w-40 text-center">
                        <span class="px-2 py-1 rounded bg-zinc-800 text-xs text-zinc-400">{{quantidadePalestras}} palestras</span>
                    </div>
                    <div class="w-32 flex justify-end gap-3 items-center">
                        <a href="/read/usuario/id/{{id}}" class="text-zinc-500 hover:text-white transition-colors text-xs font-medium">Ver Perfil</a>
                    </div>
                </div>
                {{/lista}}
                {{^lista}}
                <div class="p-8 text-center text-zinc-500 text-sm">Nenhum palestrante cadastrado.</div>
                {{/lista}}
            </div>
        </div>
    </main>
    <script type="module" src="/js/aside.js"></script>
</body>
</html>
