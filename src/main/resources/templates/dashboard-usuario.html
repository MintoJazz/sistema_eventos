<!DOCTYPE html>
<html lang="pt-br" class="dark">
<head>
    <meta charset="UTF-8">
    <title>Usuários | Sistema de Eventos</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap'); body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-zinc-950 text-zinc-300 antialiased min-h-screen flex" data-entidade="usuario">
    
    <app-sidebar role="{{role}}"></app-sidebar>

    <main class="flex-1 ml-64 p-8">
        <div class="flex items-center justify-between mb-8">
            <h1 class="text-2xl font-semibold text-white">Usuários</h1>
            <a href="/create/usuario" class="px-4 py-2 bg-white text-black text-sm font-bold rounded hover:bg-zinc-200">Novo Usuário</a>
        </div>
        <div class="w-full bg-zinc-900/50 border border-zinc-800 rounded-xl overflow-hidden shadow-2xl">
            <div class="flex items-center px-6 py-3 border-b border-zinc-800 bg-zinc-900 text-xs font-semibold text-zinc-500 uppercase tracking-wider">
                <div class="flex-1">Nome</div>
                <div class="w-32 text-right">Ações</div>
            </div>
            <div class="divide-y divide-zinc-800/50">
                {{#lista}}
                <div class="flex items-center px-6 py-4 hover:bg-zinc-800/40 transition-colors">
                    <div class="flex-1 font-medium text-zinc-200">{{nome}}</div>
                    <div class="w-32 flex justify-end gap-3 text-xs font-medium">
                        <a href="/read/usuario/id/{{id}}" class="text-zinc-500 hover:text-white">Ver</a>
                        <a href="/update/usuario/{{id}}" class="text-blue-500 hover:text-blue-400">Editar</a>
                        <button class="btn-delete text-red-500 hover:text-red-400" data-url="/delete/usuario/{{id}}">Excluir</button>
                    </div>
                </div>
                {{/lista}}
            </div>
        </div>
    </main>
    <script type="module" src="/js/delete.js"></script>
    <script type="module" src="/js/aside.js"></script>
</body>
</html>
