<!DOCTYPE html>
<html lang="pt-br" class="dark">
<head>
    <meta charset="UTF-8">
    <title>Detalhes da Palestra</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap'); body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-zinc-950 text-zinc-300 p-10 flex justify-center min-h-screen">
    <div class="w-full max-w-2xl">
        <nav class="mb-6 text-sm text-zinc-500">
            <a href="javascript:history.back()" class="hover:text-white transition-colors">← Voltar</a>
        </nav>
        {{#evento}}
        <div class="bg-zinc-900/50 border border-zinc-800 rounded-xl p-8 mb-8">
            <h1 class="text-2xl font-bold text-white mb-2">{{nome}}</h1>
            <div class="flex items-center gap-4 text-sm text-zinc-400 mt-4">
                <span class="bg-zinc-900 border border-zinc-800 px-3 py-1 rounded-full">
                    🕒 {{dataHora}} ({{duracao}} min)
                </span>
            </div>
            <div class="mt-6 pt-6 border-t border-zinc-800">
                <span class="text-xs uppercase tracking-widest text-zinc-500 block mb-3">Evento Pai</span>
                <a href="/read/evento/id/{{evento.id}}" class="text-emerald-400 hover:underline">
                    {{evento.nome}}
                </a>
            </div>
            <div class="mt-6 pt-6 border-t border-zinc-800">
                <span class="text-xs uppercase tracking-widest text-zinc-500 block mb-3">Palestrantes</span>
                <ul class="space-y-2">
                    {{#palestrantes}}
                    <li class="flex items-center gap-2">
                        <div class="w-6 h-6 rounded-full bg-zinc-800 flex items-center justify-center text-[10px]">P</div>
                        <span class="text-zinc-300">{{nome}}</span>
                    </li>
                    {{/palestrantes}}
                    {{^palestrantes}}
                    <li class="text-zinc-600 italic text-sm">Nenhum palestrante vinculado.</li>
                    {{/palestrantes}}
                </ul>
            </div>
            <div class="mt-8 pt-6 border-t border-zinc-800 flex justify-end">
                <a href="/update/palestra/{{id}}?eventoId={{evento.id}}" class="px-4 py-2 bg-zinc-800 hover:bg-zinc-700 text-white text-sm rounded transition-colors">
                    Editar Palestra
                </a>
            </div>
        </div>
        {{/evento}}
    </div>
</body>
</html>
