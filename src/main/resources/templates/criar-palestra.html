<!DOCTYPE html>
<html lang="pt-br" class="dark">
<head>
    <meta charset="UTF-8">
    <title>Nova Palestra</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap'); body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-zinc-950 text-zinc-300 flex justify-center items-center min-h-screen py-10">
    <div class="w-full max-w-2xl">
        <div class="flex items-center justify-between mb-8 border-b border-zinc-800 pb-4">
            <div>
                <h2 class="text-xl font-semibold text-white">Adicionar Palestra/Show</h2>
                <p class="text-sm text-zinc-500 mt-1">Vincule conteúdo e palestrantes ao evento.</p>
            </div>
            <a href="javascript:history.back()" class="text-sm text-zinc-400 hover:text-white transition-colors">Cancelar</a>
        </div>
        <form id="formulario" action="/create/palestra" method="POST" class="space-y-6">
            <div class="grid gap-2">
                <label class="text-xs font-medium text-zinc-400 uppercase">Evento Vinculado</label>
                <select name="eventoId" class="w-full bg-zinc-900 border border-zinc-800 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-zinc-600">
                    {{#eventos}}
                    <option value="{{id}}">{{nome}}</option>
                    {{/eventos}}
                </select>
            </div>
            <div class="grid gap-2">
                <label class="text-xs font-medium text-zinc-400 uppercase">Título da Palestra</label>
                <input type="text" name="nome" required class="w-full bg-zinc-900 border border-zinc-800 rounded-lg px-3 py-2 text-sm text-white">
            </div>
            <div class="grid grid-cols-2 gap-4">
                <div class="grid gap-2">
                    <label class="text-xs font-medium text-zinc-400 uppercase">Início (Data e Hora)</label>
                    <input type="datetime-local" name="dataHoraInicio" required class="w-full bg-zinc-900 border border-zinc-800 rounded-lg px-3 py-2 text-sm text-zinc-300">
                </div>
                <div class="grid gap-2">
                    <label class="text-xs font-medium text-zinc-400 uppercase">Duração (min)</label>
                    <input type="number" name="duracao" value="60" required class="w-full bg-zinc-900 border border-zinc-800 rounded-lg px-3 py-2 text-sm text-white">
                </div>
            </div>
            <div class="grid gap-2">
                <label class="text-xs font-medium text-zinc-400 uppercase">Palestrantes (Segure Ctrl para selecionar vários)</label>
                <select name="palestrantesIds" multiple class="w-full bg-zinc-900 border border-zinc-800 rounded-lg px-3 py-2 text-sm text-white h-40 focus:outline-none focus:border-zinc-600">
                    {{#palestrantes}}
                    <option value="{{id}}">{{nome}}</option>
                    {{/palestrantes}}
                </select>
                <p class="text-xs text-zinc-600">Usuários selecionados serão promovidos a palestrantes automaticamente.</p>
            </div>
            <div class="flex justify-end pt-4 border-t border-zinc-800">
                <button type="submit" class="px-6 py-2 bg-white text-black text-sm font-bold rounded-md hover:bg-zinc-200 transition-colors">
                    Salvar Palestra
                </button>
            </div>
        </form>
    </div>
    <script type="module" src="/js/submit.js"></script>
</body>
</html>
